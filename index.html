    <script>
        function reportGlobalError(title, details) {
            var errorConsole = document.getElementById('console');
            if (!errorConsole) return;
            if (errorConsole.textContent.trim() === '--') errorConsole.textContent = '';
            var entry = document.createElement('span');
            entry.style.color = '#f87171';
            entry.style.whiteSpace = 'pre-wrap';
            entry.textContent = title + '\n' + details + '\n\n';
            errorConsole.appendChild(entry);
        }

        window.onerror = function (msg, url, lineno, colno, error) {
            var stack = error && error.stack ? error.stack : 'No stack trace';
            reportGlobalError('Error: ' + msg, 'URL: ' + url + '\nLine: ' + lineno + '\n' + stack);
            return true;
        };

        window.addEventListener('unhandledrejection', function (event) {
            reportGlobalError('Unhandled Promise Rejection:', String(event.reason));
        });

        var ua = navigator.userAgent;
        var isPS4 = ua.indexOf("PlayStation 4") !== -1;
        var is67x = ((ua.indexOf(" 6.70") !== -1) || (ua.indexOf(" 6.71") !== -1) || (ua.indexOf(" 6.72") !== -1));
        
        var jailbreakNow = sessionStorage.getItem("jailbreakNow") != null;
        if (isPS4 && is67x && jailbreakNow) {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', './src/badhoist/672entrypoint.js', false);
                xhr.send('');
                if (xhr.status === 200) eval.call(top.window, xhr.responseText);
            } catch (e) { console.error("Entrypoint hook failed: " + e.message); }
        }
    </script>
